<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameTestLab · 过程评审</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#21302c;background:#f4f6f1;font-size:15px}*{box-sizing:border-box}body{margin:0}header{padding:25px 38px;border-bottom:1px solid #d9dfd6;background:#fff;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0 0 5px}small,.muted{color:#67766d}button,select,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #c8d2c7;background:#fff;border-radius:8px;padding:9px 15px;color:inherit}button:hover{background:#eaf0e7}.primary{background:#254e3b;color:white;border:0}.layout{max-width:1500px;margin:auto;display:grid;grid-template-columns:260px 1fr;gap:24px;padding:28px}aside button{display:block;width:100%;text-align:left;margin-bottom:10px;padding:16px}.active{border-color:#254e3b;background:#e5eee1}main{min-width:0}.metrics{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}.metric,.panel{background:white;border:1px solid #dfe5dc;border-radius:12px;padding:22px}.metric{flex:1;min-width:155px}.metric strong{display:block;font-size:27px;margin-bottom:6px}.panel{margin-bottom:18px}h2{font-size:18px;margin:0 0 18px}h3{font-size:15px;margin:0 0 10px}p{line-height:1.7;margin:8px 0}pre{white-space:pre-wrap;word-break:break-word;background:#f1f4ee;padding:16px;border-radius:8px;font:13px/1.65 ui-monospace,monospace;max-height:440px;overflow:auto}.step{padding:15px 0;border-top:1px solid #e6ebe2}.step:first-child{border:0}.tag{display:inline-block;font-size:12px;padding:4px 9px;border-radius:20px;background:#eef2e8;margin-right:7px}.warn{background:#fff1d6}.finding{border-left:3px solid #b88734;padding:4px 16px;margin:15px 0}label{display:block;margin:14px 0 6px}input,textarea,select{padding:10px;border:1px solid #ccd6c8;border-radius:7px;width:100%;background:white}textarea{min-height:100px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}a{color:#285c43}iframe{width:100%;height:640px;border:1px solid #ddd;background:white}details{margin:12px 0}summary{cursor:pointer}#message{min-height:24px;color:#285c43}.error{color:#a23424!important}@media(max-width:800px){.layout{grid-template-columns:1fr;padding:16px}header{padding:20px}aside{display:flex;overflow:auto;gap:8px}aside button{min-width:190px}.grid{grid-template-columns:1fr}}
</style></head><body><header><div><h1>GameTestLab</h1><small>游戏生成 · 执行证据 · 过程评审</small></div><button id="refresh">刷新结果</button></header><div class="layout"><aside id="cases"></aside><main><div class="metrics" id="metrics"></div><div id="detail"><div class="panel">正在读取实验记录…</div></div><p id="message" role="status"></p></main></div>
<script>
let selected=null, token=null, state=null;
const $=id=>document.getElementById(id);
const node=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
const labels={planning:'编写方案',generating:'生成代码',testing:'执行玩法测试',reviewing:'Hy3 评审',complete:'评测完成',failed:'运行中断，记录已保留'};
const value=v=>v===null||v===undefined?'证据不足':v?'正确':'有问题';
const percent=v=>v===null?'待复核':(v*100).toFixed(1)+'%';
async function get(url){const r=await fetch(url);const d=await r.json();if(!r.ok)throw Error(d.error||'读取失败');return d}
function panel(title){const p=node('section',undefined,'panel');p.append(node('h2',title));$('detail').append(p);return p}
async function load(){const data=await get('/api/cases');token=data.token;$('cases').replaceChildren();for(const item of data.cases){const b=node('button');b.append(node('h3',item.id),node('small',labels[item.status?.stage]||'等待开始'));if(item.id===selected)b.classList.add('active');b.onclick=()=>show(item.id);$('cases').append(b)}$('metrics').replaceChildren();for(const [n,v] of [['游戏',data.cases.length],['已完成',data.cases.filter(c=>c.status?.stage==='complete').length],['复核模型','Hy3']]){const m=node('div',undefined,'metric');m.append(node('strong',String(v)),node('small',n));$('metrics').append(m)}if(!selected&&data.cases.length)selected=data.cases[0].id;if(selected)await show(selected)}
async function show(id){selected=id;state=await get('/api/cases/'+id);$('detail').replaceChildren();let p=panel(id);p.append(node('span',state.status?.difficulty||'未分层','tag'),node('span',labels[state.status?.stage]||'等待开始','tag'),node('p','执行结果、模型判断与代码追溯分别保存，不将工具写入序号视为推理步骤。','muted'));
const requirements=panel('玩法要求');for(const r of state.task?.requirements||[])requirements.append(node('p',r.statement));
if(state.diagnostic){const d=panel('补充对照：起跳时机');d.append(node('p','只改变真实按键时机，不修改游戏代码或对象状态。这组对照不替换原来的固定路径成绩。'));for(const mode of ['immediate','grounded-input']){const runs=state.diagnostic.runs.filter(r=>r.mode===mode);d.append(node('p',(mode==='immediate'?'立即起跳':'确认落地后起跳')+'：'+runs.filter(r=>r.final.status==='won').length+'/'+runs.length+' 次通关'))}if(state.diagnostic_review){d.append(node('h3','Hy3 补充意见'),node('p',state.diagnostic_review.verdict.assessment),node('p',state.diagnostic_review.verdict.process_implication));for(const limit of state.diagnostic_review.verdict.remaining_limits)d.append(node('p',limit,'muted'))}else d.append(node('p','补充证据的 Hy3 复核尚未完成。','muted'))}
p=panel('公开实现方案');for(const s of state.plan?.steps||[]){const row=node('div',undefined,'step');row.append(node('h3',s.id+'. '+s.requirement),node('p',s.implementation),node('p','计划验证：'+s.verification,'muted'));p.append(row)}if(!state.plan)p.append(node('p','方案尚未生成。'));
p=panel('Hy3 评审与定位');const verdict=state.review?.verdict;if(verdict){p.append(node('p','最终功能：'+value(verdict.final_correct)+' · 过程：'+value(verdict.process_correct)+' · 首错方案步骤：'+(verdict.first_error_step??'未确定')));for(const f of state.review.findings){const row=node('div',undefined,'finding');row.append(node('span',f.status,'tag'),node('p',f.explanation));if(f.excerpt)row.append(node('pre',f.excerpt));row.append(node('small',(f.file||'无代码引用')+' · 字节核对：'+(f.quote_verified===true?'匹配':'未确认')+' · 工具步骤：'+(f.code_provenance?.contributing_tool_steps.join(', ')||'未确认')));p.append(row)}for(const l of verdict.limits)p.append(node('p',l,'muted'))}else p.append(node('p','Hy3 评审尚未完成。'));
p=panel('执行证据');p.append(node('p','生成记录重建：'+(state.provenance?.complete?'与最终文件一致':'尚未确认')));for(const s of state.result?.scenarios||[]){const d=node('details');d.append(node('summary',s.scenario_id+' · 重放 '+(s.replay_index+1)+' · 规则结果 '+value(s.evaluation?.final_outcome_correct)),node('pre',JSON.stringify(s.evaluation,null,2)));p.append(d)}if(state.result){for(const [file,label] of [['result.json','完整执行结果'],['events.jsonl','操作、状态与事件原始记录']]){const a=node('a',label);a.href='/artifact/'+id+'/browser/'+file;a.target='_blank';a.rel='noopener';p.append(a,node('span','　'))}}
const play=node('details');play.append(node('summary','打开游戏'));play.addEventListener('toggle',()=>{if(play.open&&!play.querySelector('iframe')){const frame=node('iframe');frame.sandbox='allow-scripts';frame.src='/artifact/'+id+'/game/index.html';play.append(frame)} });p.append(play);
if(state.result){const traces=node('details');traces.append(node('summary','逐步查看操作和对象状态'));const body=node('div');traces.append(body);p.append(traces);let loaded=false;traces.addEventListener('toggle',async()=>{if(!traces.open||loaded)return;loaded=true;body.textContent='正在读取…';try{const response=await fetch('/artifact/'+id+'/browser/events.jsonl');if(!response.ok)throw Error('操作记录读取失败');const rows=(await response.text()).trim().split('\n').filter(Boolean).map(line=>JSON.parse(line));body.replaceChildren();body.append(node('p','状态来自游戏接口；这里只比较相邻操作后的观测，不把状态变化自动判为错误。','muted'));const previous=new Map();for(const row of rows){const key=row.scenario_id+':'+row.replay_index;const before=previous.get(key),after=row.bridge?.state||{};const changes={};for(const name of new Set([...Object.keys(before||{}),...Object.keys(after)])){if(!before||JSON.stringify(before[name])!==JSON.stringify(after[name]))changes[name]={before:before?before[name]??null:'无前序观测',after:after[name]??null}}previous.set(key,after);const step=node('details');step.append(node('summary',row.scenario_id+' · 重放 '+(row.replay_index+1)+' · 操作 '+row.action_index+' '+row.action_id+' · '+row.elapsed_ms+' ms'),node('pre',JSON.stringify(changes,null,2)));if(row.game_events?.length)step.append(node('small','产生的事件'),node('pre',JSON.stringify(row.game_events,null,2)));const full=node('details');full.append(node('summary','完整状态与时间采样'),node('pre',JSON.stringify({state:after,samples:row.samples,errors:row.runtime_errors},null,2)));step.append(full);body.append(step)}}catch(error){loaded=false;body.textContent=error.message}})}
const timeline=panel('代码生成轨迹');for(const [i,call] of (state.tools?.calls||[]).entries()){if(!['Write','Edit'].includes(call.tool))continue;const d=node('details');d.id='tool-step-'+(i+1);d.append(node('summary','步骤 '+(i+1)+' · '+call.tool+' '+(call.file||'未确认路径')+' · '+call.status));const a=call.arguments||{};if(call.tool==='Edit'){d.append(node('small','修改前'),node('pre',a.old_string||''),node('small','修改后'),node('pre',a.new_string||''))}else d.append(node('pre',a.content||'没有记录内容'));const snap=state.snapshots?.find(s=>s.tool_step===i+1);if(snap)d.append(node('small',snap.bundle_complete?'四个游戏文件已齐备；不代表功能通过':'文件尚未齐备，不作为运行错误'));timeline.append(d)}if(!state.tools?.calls.length)timeline.append(node('p','工具记录尚未生成。'));
document.querySelectorAll('.finding').forEach((row,index)=>{const f=state.review.findings[index];const meanings={supported_defect:'有证据支持的问题',insufficient_evidence:'证据不足',repaired:'已经修复',test_problem:'测试标准问题'};row.querySelector('.tag').textContent=meanings[f.status]||f.status;for(const step of f.code_provenance?.contributing_tool_steps||[]){const button=node('button','查看写入步骤 '+step);button.onclick=()=>{const target=$('tool-step-'+step);if(target){target.open=true;target.scrollIntoView({behavior:'smooth',block:'center'})}};row.append(button)}});
const code=panel('最终代码');for(const [file,text] of Object.entries(state.code)){const d=node('details');d.append(node('summary',file),node('pre',text));code.append(d)}

}
$('refresh').onclick=()=>load().catch(e=>{$('message').textContent=e.message});load().catch(e=>{$('message').textContent=e.message});
</script></body></html>
