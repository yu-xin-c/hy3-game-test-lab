<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>游戏探索记录 · GameTestLab</title>
<style>
:root{font-family:system-ui,sans-serif;color:#243243;background:#f4f6f8}body{max-width:1150px;margin:auto;padding:28px}nav{display:flex;gap:20px}a{color:#245ca8}h1{font-size:28px;margin-bottom:8px}h2{font-size:20px}p{line-height:1.6}.muted{color:#596879}select,button{font:inherit;padding:8px;border:1px solid #b7c3cf;border-radius:5px;background:white}section{background:white;border:1px solid #dce2e8;padding:20px;margin-top:18px;border-radius:8px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e2e7ed;vertical-align:top}tr.selected{background:#e7f0fc}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.5;background:#f5f7fa;padding:12px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.scroll{overflow:auto}.error{color:#a12e30}details{margin-top:14px}@media(max-width:750px){body{padding:16px}.columns{grid-template-columns:1fr}}
.scroll{max-height:400px}pre{max-height:320px;overflow:auto}thead{position:sticky;top:0;background:#fff}button{cursor:pointer}button:hover{background:#e7f0fc}
</style></head><body>
<nav><a href="/">生成过程</a><a href="/mined">真实错误复验</a><a href="/exploration">自主探索</a></nav>
<h1>游戏探索记录</h1><p class="muted">混元选择操作，Chromium 执行并采集状态；独立复核再查看代码。此页只读。</p>
<label>选择游戏 <select id="case" aria-label="选择游戏"></select></label><p id="message" role="status">正在加载记录…</p>
<section><h2>执行与复现</h2><p id="summary"></p><p id="environment" class="muted"></p><p class="muted">重放一致只说明该固定输入产生相同观测。没有发现缺陷不等于完整游戏正确；工具写入位置也不等于首个推理错误。</p></section>
<section><h2>操作轨迹</h2><p>点击“查看”对比该步前后的对象状态与页面文字。步骤从 0 开始。</p><div class="scroll"><table><thead><tr><th>步骤</th><th>实际操作</th><th>状态变化</th><th>执行结果</th><th></th></tr></thead><tbody id="steps"></tbody></table></div></section>
<section><h2 id="step-title">单步证据</h2><p id="intent"></p><div class="columns"><div><h3>操作前</h3><pre id="before"></pre></div><div><h3>操作后</h3><pre id="after"></pre></div></div></section>
<section><h2>混元独立复核</h2><div id="review"></div><div id="diagnostic"></div><p class="muted">Zen Garden 的补充复核是针对漏检开展的诊断，保留初次结果，不作为独立准确率。模型解释可能有记录引用错误，应以左侧原始步骤证据为准。</p></section>
<script>
const $=id=>document.getElementById(id);let cases=[];
const element=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e};
function review(parent,data,title){parent.replaceChildren(element('h3',title));if(!data){parent.append(element('p','没有此项记录'));return}parent.append(element('p',data.findings.length?'复核提出 '+data.findings.length+' 项问题':'复核未提出缺陷，不代表全部要求已通过'));
for(const f of data.findings){const box=document.createElement('details');box.open=true;box.append(element('summary',`步骤 ${f.first_observed_step} · ${f.error_type}`),element('p',f.explanation));const p=f.code_provenance;box.append(element('p',p?`${p.file}:${p.line} · 工具写入步骤 ${p.contributing_tool_steps.join(', ')}`:'代码引用未得到来源匹配'),element('pre',f.excerpt));parent.append(box)}for(const limit of data.limits||[])parent.append(element('p','限制：'+limit))}
function chooseStep(c,s){$('step-title').textContent='步骤 '+s.step+' 的证据';$('intent').textContent=s.decision.reason;for(const side of ['before','after'])$(side).textContent=JSON.stringify({state:s[side].probe,page_text:s[side].text,status_cross_check:s[side].status_cross_check,controls:s[side].controls},null,2);for(const row of $('steps').children)row.classList.toggle('selected',Number(row.dataset.step)===s.step)}
function render(){const c=cases.find(x=>x.id===$('case').value);if(!c)return;const replays=c.replays.filter(Boolean), exact=replays.filter(r=>r.exact_observation_match===true).length;const errors=c.trace.steps.filter(s=>s.execution_error).length;$('summary').textContent=`${c.trace.steps.length} 步记录；${errors} 次执行拒绝或错误；固定重放 ${exact}/${replays.length} 次完整观测一致。`;$('environment').textContent=c.trace.environment?JSON.stringify(c.trace.environment):'历史记录未包含 environment；该版本视口为 1000×800，种子 404。';$('steps').replaceChildren();for(const s of c.trace.steps){const row=document.createElement('tr');row.dataset.step=s.step;row.append(element('td',String(s.step)),element('td',JSON.stringify(s.decision.action)),element('td',`${s.before.probe.status} → ${s.after.probe.status}`),element('td',s.execution_error||'已执行'));const cell=document.createElement('td'),button=element('button','查看');button.setAttribute('aria-label','查看步骤 '+s.step);button.onclick=()=>chooseStep(c,s);cell.append(button);row.append(cell);$('steps').append(row)}review($('review'),c.review,'原始独立复核');if(c.diagnostic_review)review($('diagnostic'),c.diagnostic_review,'补充页面交叉证据后的复核');else $('diagnostic').replaceChildren();if(c.trace.steps.length)chooseStep(c,c.trace.steps[0])}
fetch('/api/exploration').then(async r=>{if(!r.ok)throw new Error('读取失败');return r.json()}).then(data=>{cases=data.cases;for(const c of cases){const option=element('option',c.id);option.value=c.id;$('case').append(option)}$('message').textContent=data.scope;$('case').onchange=render;render()}).catch(e=>{$('message').textContent=e.message;$('message').className='error'});
</script></body></html>
