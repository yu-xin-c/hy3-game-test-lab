<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Memory</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="game-container">
  <canvas id="signal-canvas" width="800" height="600"></canvas>
  <div id="hud">
    <div id="hud-line">
      <span id="round-label">Round: 1/3</span>
      <span id="lives-label">Lives: 3/3</span>
      <span id="score-label" data-testid="score">0</span>
      <span id="phase-label"></span>
      <span id="status-label" data-testid="status">Menu</span>
    </div>
    <div id="feedback-label"></div>
    <div id="controls">
      <button id="start-btn" type="button">Start</button>
      <button id="restart-btn" type="button">Restart</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
