<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pet Care Day</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="viewport">
    <header id="hud">
      <div class="hud-item">进度 <span data-testid="score">H:2/P:2/E:2</span></div>
      <div class="hud-item">状态 <span data-testid="status">Menu</span></div>
    </header>
    <main id="pet-room">
      <div id="info-area"></div>
      <div class="controls-bar">
        <button id="start-btn" type="button">Start</button>
        <button id="feed-btn" type="button">Feed</button>
        <button id="play-btn" type="button">Play</button>
        <button id="sleep-btn" type="button">Sleep</button>
        <button id="restart-btn" type="button">Restart</button>
      </div>
    </main>
  </div>
  <script src="game.js"></script>
</body>
</html>
